<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Relojes</title>
    
    <style>
        body {
            margin: 0px;
            padding: 0px;
            font-family: 'Segoe UI', Verdana, sans-serif;
            background-color: #fcfcfc;
        }

        header {
            height: 80px;
            line-height: 80px;
            padding-left: 50px;
            background: #0f172a; 
            color: #FFFFFF;
            font-size: 2.5em;
            font-weight: 600;
            margin-bottom: 40px;
            
        }

        section {
            background: #f1e4d8; 
            padding: 20px 0px;
        }

        article {
            display: flex;
            justify-content: center; 
            flex-wrap: wrap;        
            gap: 18px;             
        }

        img {
            background: white; 
            border: 1px solid #e2e8f0;
            border-radius: 8px; 
            padding: 15px;
            width: 140px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); 
            object-fit: cover;
        }


    </style>
</head>
<body>

   
    <header>
        Catalogo de relojes
    </header>


    <section>
        <article>
            <img src="azul.jpg">
            <img src="rosapalo.avif">
            <img src="rojo.avif">
            <img src="vino.jpg">
            <img src="rosa.png">
            <img src="verde.jpg">
            <img src="negro.jpg">
            <img src="plata.avif">
        </article>
    </section>

</body>
</html>
